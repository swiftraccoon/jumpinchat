name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: |
            jumpinchat-web/package-lock.json
            jumpinchat-homepage/package-lock.json
            jumpinchat-email/package-lock.json
      - name: Install and validate dependency trees
        run: |
          for app in jumpinchat-web jumpinchat-homepage jumpinchat-email; do
            npm --prefix "$app" ci
            npm --prefix "$app" ls --all > /dev/null
            npm --prefix "$app" audit --audit-level=high
          done
      - run: ./scripts/test.sh
      - run: ./scripts/lint.sh
      - run: ./scripts/build.sh
      - run: node scripts/check-web-build.mjs
      - run: npm --prefix jumpinchat-homepage run build
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python3 scripts/generate-compose.py --check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 -m unittest discover -s jumpinchat-deploy/nginx -p 'test_*.py'
