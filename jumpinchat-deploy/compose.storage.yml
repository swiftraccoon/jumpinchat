# Storage tier: MinIO S3-compatible object storage
# Can run standalone on a dedicated storage server

services:
  minio:
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    image: docker.io/minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data:Z
    logging:
      options:
        max-size: '1m'
    restart: always

volumes:
  minio-data:
