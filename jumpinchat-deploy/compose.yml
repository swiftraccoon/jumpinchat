# All-in-one compose file for single-server deployment
# Includes all service groups via compose include
#
# Usage: podman-compose -f compose.yml up -d
# External object storage is configured with STORAGE_BACKEND=s3; see README.md.

include:
  - compose.app.yml
  - compose.media.yml
  - compose.data.yml
  - compose.email.yml
