global
  log stdout  format raw  local0  debug
  daemon

defaults
  log     global
  mode    http
  option  httplog
  option  dontlognull
  timeout connect 5000
  timeout client  50000
  timeout server  50000

# Re-resolve backend container hostnames at runtime so haproxy survives
# web containers being recreated with new IPs
resolvers docker
  parse-resolv-conf
  resolve_retries 3
  timeout resolve 1s
  timeout retry   1s
  hold valid      10s
  hold other      10s
  hold refused    10s
  hold nx         10s
  hold timeout    10s
  hold obsolete   10s

frontend localnodes
  bind *:80
  mode http
  default_backend nodes

backend nodes
  mode http
  balance roundrobin
  option forwardfor
  http-request set-header X-Forwarded-Port %[dst_port]
  http-request add-header X-Forwarded-Proto https if { ssl_fc }
  server web01 web:80 resolvers docker init-addr last,libc,none
  server web02 web2:80 resolvers docker init-addr last,libc,none
