# Email tier: SMTP email microservice
# Can run standalone on a dedicated server

services:
  email:
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    build: ../jumpinchat-email
    image: echo.research.clinic/jic-email
    expose:
      - "3001"
    environment:
      - PORT=3001
      - SMTP_HOST=$SMTP_HOST
      - SMTP_PORT=$SMTP_PORT
      - SMTP_SECURE=$SMTP_SECURE
      - SMTP_USER=$SMTP_USER
      - SMTP_PASS=$SMTP_PASS
      - SMTP_FROM=$SMTP_FROM
      - SHARED_SECRET=$SHARED_SECRET
    logging:
      options:
        max-size: '1m'
    restart: always
