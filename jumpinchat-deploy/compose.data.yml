# Data tier: MongoDB replica set + Redis
# Can run standalone on a dedicated data server

services:
  mongodb:
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    image: docker.io/library/mongo:9.0.2@sha256:f5c6240ae8fccc21cf75acc6462929b3394a7a5a7abd934b6b0e7ada5eb5fe95
    entrypoint: ["/bin/bash", "/usr/local/bin/jic-mongodb-entrypoint.sh"]
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    expose:
      - "27017"
    volumes:
      - ./data/db:/data/db:Z
      - ./mongodb/entrypoint.sh:/usr/local/bin/jic-mongodb-entrypoint.sh:ro,z
    logging:
      options:
        max-size: '1m'
    restart: always

  mongodbslave:
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    image: docker.io/library/mongo:9.0.2@sha256:f5c6240ae8fccc21cf75acc6462929b3394a7a5a7abd934b6b0e7ada5eb5fe95
    entrypoint: ["/bin/bash", "/usr/local/bin/jic-mongodb-entrypoint.sh"]
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    expose:
      - "27017"
    logging:
      options:
        max-size: '1m'
    restart: always
    volumes:
      - ./data/db2:/data/db:Z
      - ./mongodb/entrypoint.sh:/usr/local/bin/jic-mongodb-entrypoint.sh:ro,z

  redis:
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Override only with a release validated against the application Redis client.
    image: ${REDIS_IMAGE:-docker.io/library/redis:8.10.2@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6}
    expose:
      - "6379"
    logging:
      options:
        max-size: '1m'
    restart: always
