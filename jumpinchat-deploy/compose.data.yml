# Data tier: MongoDB replica set + Redis
# Can run standalone on a dedicated data server

services:
  mongodb:
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    image: docker.io/library/mongo:8.3@sha256:81a1c8842a09589fc8d5f285266f3340bf4abdf66700ba22988f14cc9b2b3118
    entrypoint: ["/bin/bash", "/usr/local/bin/jic-mongodb-entrypoint.sh"]
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    expose:
      - "27017"
    volumes:
      - ./data/db:/data/db:Z
      - ./mongodb/entrypoint.sh:/usr/local/bin/jic-mongodb-entrypoint.sh:ro,z
    logging:
      options:
        max-size: '1m'
    restart: always

  mongodbslave:
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    image: docker.io/library/mongo:8.3@sha256:81a1c8842a09589fc8d5f285266f3340bf4abdf66700ba22988f14cc9b2b3118
    entrypoint: ["/bin/bash", "/usr/local/bin/jic-mongodb-entrypoint.sh"]
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    expose:
      - "27017"
    logging:
      options:
        max-size: '1m'
    restart: always
    volumes:
      - ./data/db2:/data/db:Z
      - ./mongodb/entrypoint.sh:/usr/local/bin/jic-mongodb-entrypoint.sh:ro,z

  redis:
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Override only with a release validated against the application Redis client.
    image: ${REDIS_IMAGE:-docker.io/library/redis:8.10.1@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5}
    expose:
      - "6379"
    logging:
      options:
        max-size: '1m'
    restart: always
