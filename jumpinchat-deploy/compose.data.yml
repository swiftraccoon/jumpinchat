# Data tier: MongoDB replica set + Redis
# Can run standalone on a dedicated data server

services:
  mongodb:
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    image: docker.io/library/mongo:8.3@sha256:5d7043a4ffe02b9ed1b6e0bab057546981af5ca0a79107e9c461e49bc44c0a7b
    entrypoint: ["/bin/bash", "/usr/local/bin/jic-mongodb-entrypoint.sh"]
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    expose:
      - "27017"
    volumes:
      - ./data/db:/data/db:Z
      - ./mongodb/entrypoint.sh:/usr/local/bin/jic-mongodb-entrypoint.sh:ro,z
    logging:
      options:
        max-size: '1m'
    restart: always

  mongodbslave:
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    image: docker.io/library/mongo:8.3@sha256:5d7043a4ffe02b9ed1b6e0bab057546981af5ca0a79107e9c461e49bc44c0a7b
    entrypoint: ["/bin/bash", "/usr/local/bin/jic-mongodb-entrypoint.sh"]
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    expose:
      - "27017"
    logging:
      options:
        max-size: '1m'
    restart: always
    volumes:
      - ./data/db2:/data/db:Z
      - ./mongodb/entrypoint.sh:/usr/local/bin/jic-mongodb-entrypoint.sh:ro,z

  redis:
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Override only with a release validated against the application Redis client.
    image: ${REDIS_IMAGE:-docker.io/library/redis:8.10.2@sha256:d5ac52db24d4e70566fe9944f22cf5bdc2bc739b05c0f426335161ea6c23f3b3}
    expose:
      - "6379"
    logging:
      options:
        max-size: '1m'
    restart: always
